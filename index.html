<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 스포츠재활 운동 추천 시스템</title>
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"
        }
      }
    </script>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            max-width: 600px;
            width: 100%;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: none; /* 로그인 성공 전 메인 화면 숨김 */
        }
        .title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 25px;
        }
        .user-profile {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 15px;
        }
        .welcome-msg {
            font-size: 14px;
            color: #333;
            font-weight: bold;
        }
        .btn-logout {
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #1a65ff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #004ecc;
        }
        .btn-speech {
            background-color: #28a745;
            margin-top: 10px;
        }
        .btn-speech:hover {
            background-color: #218838;
        }
        .result-box {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 15px;
            border-radius: 5px;
            min-height: 50px;
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* 🔒 로그인 모달 창 스타일 */
        .login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .login-box {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 10px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .login-box h2 {
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
            font-size: 22px;
        }
        .login-desc {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
    <div class="login-box">
        <h2>🔒 시스템 로그인</h2>
        <p class="login-desc">스포츠재활 시스템을 이용하시려면 이메일과 비밀번호를 입력하세요.</p>
        <form id="loginForm">
            <div class="form-group">
                <input type="email" id="loginEmail" class="form-control" placeholder="이메일 주소 (예: 24611@daehyun.hs.kr)" required>
            </div>
            <div class="form-group">
                <input type="password" id="loginPassword" class="form-control" placeholder="비밀번호를 입력하세요" required>
            </div>
            <button type="submit" class="btn">로그인</button>
        </form>
    </div>
</div>

<div class="container" id="mainContainer">
    <div class="user-profile">
        <div>
            <span class="welcome-msg" id="userWelcome">불러오는 중...</span>
            <br><button id="logoutBtn" class="btn-logout">로그아웃</button>
        </div>
    </div>

    <div class="title">🏃‍♂️ AI 스포츠재활 운동 추천 시스템</div>
    
    <div class="section-title">회원 정보 입력</div>
    
    <form id="rehabForm">
        <div class="form-group">
            <input type="number" id="age" class="form-control" placeholder="나이를 입력하세요" required>
        </div>
        <div class="form-group">
            <input type="number" id="height" class="form-control" placeholder="키(cm)를 입력하세요" required>
        </div>
        <div class="form-group">
            <input type="number" id="weight" class="form-control" placeholder="몸무게(kg)를 입력하세요" required>
        </div>
        <div class="form-group">
            <select id="part" class="form-control" required>
                <option value="">-- 아픈 부위를 선택하세요 --</option>
                <option value="어깨">어깨</option>
                <option value="허리">허리</option>
                <option value="목">목</option>
                <option value="손가락">손가락</option>
                <option value="발목">발목</option>
            </select>
        </div>
        <div class="form-group">
            <select id="painDetail" class="form-control" required>
                <option value="">-- 상세 증상을 선택하세요 --</option>
                <option value="어깨가 아프다">어깨가 아프다</option>
                <option value="허리가 아프다">허리가 아프다</option>
                <option value="근육에 경련이 왔다">근육에 경련이 왔다</option>
                <option value="손가락 인대가 늘어났다">손가락 인대가 늘어났다</option>
                <option value="발목이 꺾였다">발목이 꺾였다</option>
            </select>
        </div>
        
        <button type="submit" class="btn">AI 운동 추천받기</button>
    </form>
    
    <div class="section-title">AI 추천 결과</div>
    <div id="result" class="result-box">대기 중...</div>
    
    <button id="speakBtn" class="btn btn-speech" style="display:none;">🔊 음성으로 듣기</button>
</div>

<script type="module">
    import { initializeApp } from "firebase/app";
    import { getFirestore, collection, addDoc, serverTimestamp } from "firebase/firestore";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "firebase/auth";

    // ⚠️ [필수 수정!!] 파이어베이스 콘솔의 프로젝트 설정에서 진짜 회원님 정보를 그대로 복사해 붙여넣으세요!
    // "YOUR_API_KEY" 상태로 두면 아까 발생했던 auth/api-key-not-valid 에러가 다시 납니다!
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY", 
        authDomain: "sport-let-s-go.firebaseapp.com",
        projectId: "sport-let-s-go",
        storageBucket: "sport-let-s-go.appspot.com",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID", 
        appId: "YOUR_APP_ID"
    };

    // 파이어베이스 초기화 실행
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // 구글 앱 스크립트 웹 앱 URL 주소 유지
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCMxsYmyF2x_HNaUPTunDuc5NSgCaANRJR-ulILk9uEe83Pi38eE3Y0nXRW2kBmXPrfQ/exec";

    let currentUserData = null;

    // 🔒 이메일/비밀번호 로그인 처리
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // "YOUR_API_KEY" 기본값 필터 및 사전 안내 장치
        if (firebaseConfig.apiKey.includes("YOUR_")) {
            alert("⚠️ 코드 내부의 firebaseConfig 설정을 본인의 파이어베이스 고유 키값으로 수정해 주셔야 로그인이 정상 작동합니다!");
            return;
        }

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        signInWithEmailAndPassword(auth, email, password)
            .then((userCredential) => {
                console.log("로그인 완료:", userCredential.user.email);
            })
            .catch((error) => {
                console.error("로그인 실패 에러코드:", error.code);
                alert("로그인에 실패했습니다. 이메일과 비밀번호를 다시 확인해 주세요.\n(에러내용: " + error.message + ")");
            });
    });

    // 🔓 로그인 상태 변화 실시간 추적 엔진
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUserData = user;
            document.getElementById('userWelcome').innerText = `👤 ${user.email}님 환영합니다`;
            
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
        } else {
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('mainContainer').style.display = 'none';
        }
    });

    // 🚪 로그아웃 기능
    document.getElementById('logoutBtn').addEventListener('click', () => {
        signOut(auth).then(() => {
            alert("로그아웃 되었습니다.");
        });
    });

    // 🏃‍♂️ 운동 추천 양식 처리 및 Firestore 데이터 자동 전송
    document.getElementById('rehabForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const resultDiv = document.getElementById('result');
        const speakBtn = document.getElementById('speakBtn');
        
        resultDiv.innerText = "AI가 증상을 기반으로 맞춤 재활 운동 가이드를 생성하고 있습니다...";
        speakBtn.style.display = "none";

        const formData = {
            name: currentUserData ? currentUserData.email.split('@')[0] : "남경우",
            email: currentUserData ? currentUserData.email : "이메일없음",
            age: document.getElementById('age').value,
            height: document.getElementById('height').value,
            weight: document.getElementById('weight').value,
            part: document.getElementById('part').value,
            painDetail: document.getElementById('painDetail').value
        };

        // 구글 앱 스크립트 API 통신 연동
        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(formData)
        })
        .then(response => {
            if (!response.ok) throw new Error('네트워크 응답 불량');
            return response.json();
        })
        .then(data => {
            // undefined 에러 해결용 매칭 검사
            if (data.error) {
                resultDiv.innerText = "❌ 오류 발생:\n" + data.error;
            } else if (data.result) {
                resultDiv.innerText = data.result;
                speakBtn.style.display = "block"; // TTS 버튼 보이기

                // 파이어베이스 Firestore 'rehab_records' 컬렉션에 실시간 기록 보관 연동
                const saveData = {
                    ...formData,
                    uid: currentUserData ? currentUserData.uid : "",
                    aiRecommendation: data.result,
                    createdAt: serverTimestamp()
                };

                addDoc(collection(db, "rehab_records"), saveData)
                    .then(() => {
                        console.log("Firestore 데이터베이스에 정상 연동 세이브 완료");
                    })
                    .catch((fsError) => {
                        console.error("Firestore 저장 실패:", fsError);
                    });
            } else {
                resultDiv.innerText = "응답 반환 구조에 문제가 발생했습니다.";
            }
        })
        .catch(error => {
            console.error('Error:', error);
            resultDiv.innerText = "통신 연결 에러가 발생했습니다. 구글 앱 스크립트 배포 주소를 확인하세요.";
        });
    });

    // TTS 기능
    document.getElementById('speakBtn').addEventListener('click', function() {
        const text = document.getElementById('result').innerText;
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            window.speechSynthesis.speak(utterance);
        } else {
            alert("이 브라우저는 TTS 음성 출력을 지원하지 않습니다.");
        }
    });
</script>
</body>
</html>
