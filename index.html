<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI 스포츠재활 운동 추천 시스템</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f6f8;
margin:0;
padding:30px;
}

.container{
max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,0.1);
}

h1{
text-align:center;
}

input,
select,
textarea{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
border:none;
background:#2563eb;
color:white;
border-radius:10px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

button:hover{
opacity:0.9;
}

.result{
margin-top:20px;
padding:15px;
background:#f8fafc;
border-radius:10px;
}

audio{
width:100%;
margin-top:15px;
}
</style>

</head>
<body>

<div class="container">

<h1>🏃 AI 스포츠재활 운동 추천 시스템</h1>

<h3>회원 정보 입력</h3>

<input id="name" placeholder="이름">

<input id="age" type="number" placeholder="나이">

<input id="height" type="number" placeholder="키(cm)">

<input id="weight" type="number" placeholder="몸무게(kg)">

<select id="injury">
<option>발목</option>
<option>무릎</option>
<option>허리</option>
<option>어깨</option>
<option>손목</option>
</select>

<select id="pain">
<option value="1">통증 1</option>
<option value="2">통증 2</option>
<option value="3">통증 3</option>
<option value="4">통증 4</option>
<option value="5">통증 5</option>
<option value="6">통증 6</option>
<option value="7">통증 7</option>
<option value="8">통증 8</option>
<option value="9">통증 9</option>
<option value="10">통증 10</option>
</select>

<button onclick="getRecommend()">
AI 운동 추천받기
</button>

<div class="result">

<h3>AI 추천 결과</h3>

<div id="result">

추천 결과가 여기에 표시됩니다.

</div>

<button onclick="makeTTS()">

🔊 음성으로 듣기

</button>

<audio id="audioPlayer" controls></audio>

</div>

</div>

<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbz0kWlWbBqSBgsnO8Jt5NKOaiUfu_DAqYzsIVgsudvg-eLBnEKhr9shC8RhTVsM_E29hw/exec";

async function getRecommend(){

const body = {

type:"recommend",

name:document.getElementById("name").value,

age:document.getElementById("age").value,

height:document.getElementById("height").value,

weight:document.getElementById("weight").value,

injury:document.getElementById("injury").value,

pain:document.getElementById("pain").value

};

const response = await fetch(
APPS_SCRIPT_URL,
{
method:"POST",
body:JSON.stringify(body)
}
);

const data = await response.json();

document.getElementById("result")
.innerText = data.result;

}

async function makeTTS(){

const text =
document.getElementById("result")
.innerText;

const response = await fetch(
APPS_SCRIPT_URL,
{
method:"POST",
body:JSON.stringify({
type:"tts",
text:text
})
}
);

const data = await response.json();

if(data.audioBase64){

const audio =
document.getElementById("audioPlayer");

audio.src =
"data:audio/mp3;base64," +
data.audioBase64;

audio.play();

}

}

</script>

</body>
</html>
