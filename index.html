<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 스포츠재활 운동 추천 시스템</title>
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
        }
      }
    </script>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            max-width: 600px;
            width: 100%;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #1a65ff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #004ecc;
        }
        .btn-speech {
            background-color: #28a745;
            margin-top: 10px;
        }
        .btn-speech:hover {
            background-color: #218838;
        }
        .result-box {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 15px;
            border-radius: 5px;
            min-height: 50px;
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">🏃‍♂️ AI 스포츠재활 운동 추천 시스템</div>
    
    <div class="section-title">회원 정보 입력</div>
    
    <form id="rehabForm">
        <div class="form-group">
            <input type="text" id="name" class="form-control" placeholder="이름을 입력하세요" required>
        </div>
        <div class="form-group">
            <input type="number" id="age" class="form-control" placeholder="나이를 입력하세요" required>
        </div>
        <div class="form-group">
            <input type="number" id="height" class="form-control" placeholder="키(cm)를 입력하세요" required>
        </div>
        <div class="form-group">
            <input type="number" id="weight" class="form-control" placeholder="몸무게(kg)를 입력하세요" required>
        </div>
        <div class="form-group">
            <select id="part" class="form-control" required>
                <option value="">-- 아픈 부위를 선택하세요 --</option>
                <option value="어깨">어깨</option>
                <option value="허리">허리</option>
                <option value="목">목</option>
                <option value="손가락">손가락</option>
                <option value="발목">발목</option>
            </select>
        </div>
        <div class="form-group">
            <select id="painDetail" class="form-control" required>
                <option value="">-- 상세 증상을 선택하세요 --</option>
                <option value="shoulder_pain">어깨가 아프다</option>
                <option value="back_pain">허리가 아프다</option>
                <option value="muscle_cramp">근육에 경련이 왔다</option>
                <option value="finger_ligament">손가락 인대가 늘어났다</option>
                <option value="ankle_sprain">발목이 꺾였다</option>
            </select>
        </div>
        
        <button type="submit" class="btn">AI 운동 추천받기</button>
    </form>
    
    <div class="section-title">AI 추천 결과</div>
    <div id="result" class="result-box">대기 중...</div>
    
    <button id="speakBtn" class="btn btn-speech" style="display:none;">🔊 음성으로 듣기</button>
</div>

<script type="module">
    import { initializeApp } from "firebase/app";
    import { getFirestore, collection, addDoc, serverTimestamp } from "firebase/firestore";

    // ⚠️ [필수 수정] 회원님의 파이어베이스 웹 앱 등록 시 발급받은 키값들을 아래에 정확히 입력하세요!
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "sport-let-s-go.firebaseapp.com",
        projectId: "sport-let-s-go",
        storageBucket: "sport-let-s-go.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // 파이어베이스 및 데이터베이스 초기화
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 구글 앱 스크립트 웹 앱 URL (보내주신 주소 유지)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCMxsYmyF2x_HNaUPTunDuc5NSgCaANRJR-ulILk9uEe83Pi38eE3Y0nXRW2kBmXPrfQ/exec";

    document.getElementById('rehabForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const resultDiv = document.getElementById('result');
        const speakBtn = document.getElementById('speakBtn');
        
        resultDiv.innerText = "AI가 맞춤 재활 분석을 시작합니다. 잠시만 기다려주세요...";
        speakBtn.style.display = "none";

        // 입력 폼 데이터 수집
        const formData = {
            name: document.getElementById('name').value,
            age: document.getElementById('age').value,
            height: document.getElementById('height').value,
            weight: document.getElementById('weight').value,
            part: document.getElementById('part').value,
            painDetail: document.getElementById('painDetail').value
        };

        // 1. 구글 앱 스크립트로 POST 요청 전송 (AI 분석 받아오기)
        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(formData)
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('네트워크 응답에 문제가 발생했습니다.');
            }
            return response.json();
        })
        .then(data => {
            if (data.error) {
                resultDiv.innerText = "❌ 오류 발생:\n" + data.error;
            } else if (data.result) {
                // 정상적으로 GPT 답변이 온 경우 화면에 출력
                resultDiv.innerText = data.result;
                speakBtn.style.display = "block"; // 음성 듣기 버튼 보이기

                // 2. 파이어베이스 Firestore 데이터베이스에 실시간 기록 저장
                const saveData = {
                    ...formData,
                    aiRecommendation: data.result,
                    createdAt: serverTimestamp() // 저장 시간 서버 표준으로 기록
                };

                // 'rehab_records' 라는 이름의 컬렉션으로 자동 전송 및 생성
                addDoc(collection(db, "rehab_records"), saveData)
                    .then(() => {
                        console.log("Firebase Firestore에 회원 데이터가 성공적으로 저장되었습니다.");
                    })
                    .catch((fsError) => {
                        console.error("Firebase 저장 실패:", fsError);
                    });

            } else {
                resultDiv.innerText = "알 수 없는 응답 형식이 반환되었습니다.";
            }
        })
        .catch(error => {
            console.error('Error:', error);
            resultDiv.innerText = "통신 오류가 발생했습니다.\n1. 앱 스크립트 '새 배포' 후 URL을 정상적으로 교체했는지 확인하세요.\n2. 액세스 권한이 '모든 사용자(Anyone)'로 되어있는지 확인하세요.";
        });
    });

    // 음성 합성(TTS) 기능
    document.getElementById('speakBtn').addEventListener('click', function() {
        const text = document.getElementById('result').innerText;
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // 이전 음성 재생 중지
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR'; // 한국어 설정
            utterance.rate = 1.0;     // 재생 속도
            window.speechSynthesis.speak(utterance);
        } else {
            alert("이 브라우저는 음성 재생 기능을 지원하지 않습니다.");
        }
    });
</script>
</body>
</html>
